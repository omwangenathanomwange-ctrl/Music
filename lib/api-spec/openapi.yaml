openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /downloads/{trackId}:
    get:
      operationId: downloadTrack
      tags: [music]
      summary: Download a public demo audio track
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: string
            enum:
              - soundhelix-1
              - soundhelix-2
              - soundhelix-3
              - soundhelix-4
              - soundhelix-5
              - soundhelix-6
              - soundhelix-7
              - soundhelix-8
      responses:
        "200":
          description: MP3 audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Unknown track ID
        "502":
          description: Audio source is unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

