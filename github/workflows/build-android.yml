
name: Build CHRAVAN STUDIO APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/chravan/**"
      - ".github/workflows/build-android.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CHRAVAN website
        run: pnpm --dir artifacts/chravan build

      - name: Check Capacitor Android project
        run: |
          test -f artifacts/chravan/capacitor.config.ts
          test -d artifacts/chravan/android || {
            echo "Android project is missing."
            echo "Generate it with Capacitor before building the APK."
            exit 1
          }

      - name: Build debug APK
        working-directory: artifacts/chravan
        run: |
          pnpm exec cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHRAVAN-STUDIO-APK
          path: artifacts/chravan/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
